train_data_class: TactileDataset
train_data_class_path: data/tactile_dataset.py
output_dir: outputs/stage1_lite_v0c_full
sub_folder: null
logging_dir: tb
visual_vae_path: pretrained_models/ltx_video
visual_vae_path_kind: subfolder
visual_vae_load_weights: true
mixed_precision: bf16
gradient_accumulation_steps: 1
nccl_timeout: 1800
allow_tf32: true
seed: 42
optimizer: adamw
optimizer_8bit: false
optimizer_torchao: false
lr: 0.0001
beta1: 0.9
beta2: 0.95
beta3: 0.98
epsilon: 1.0e-08
weight_decay: 0.0001
scale_lr: false
lr_scheduler: constant_with_warmup
lr_warmup_steps: 1000
lr_num_cycles: 1
lr_power: 1.0
batch_size: 16
gradient_checkpointing: false
train_epochs: 5
train_steps: 30000
max_grad_norm: 1.0
steps_to_log: 25
steps_to_val: 1000
steps_to_save: 5000
lambda_kl_warmup_steps: 0
best_ckpt_metrics:
- val_flow_mse_active_mean
- val_recall_post_mean
dataloader_num_workers: 4
persistent_workers: true
pin_memory: true
wandb:
  enabled: true
  project: dex_vtam_tactile_vae_stage1
  entity: null
  name: null
  tags:
  - stage1_lite_v0c
  - full_488
  - frozen_visual_vae
  - finger_set_transformer
  - diverse_488_episodes
  - adapter_capacity_v2
  notes: 'Stage 1 lite v0c-A: deeper FingerSetTransformerAdapter (3 layers, 8 heads,
    FFN 1024) on the same 488-ep corpus and same loss as v0_full. Tests the adapter-capacity
    hypothesis raised by v0_full step 30k (gap=0.29 widening over training, suggesting
    the 1-layer attention adapter is the structural bottleneck). Same data, same split
    (train 0..463, val 464..487), same optimizer + LR schedule, same train_steps=30000,
    same val protocol. Apples-to-apples comparison with v0_full + v0b at steps 12k
    / 20k / 30k.'
  mode: online
tactile_vae:
  model_path: null
  config:
    adapter_kind: finger_set_transformer
    latent_channels: 128
    num_fingers: 5
    spatial_h: 6
    spatial_w: 8
    adapter_n_heads: 8
    adapter_n_layers: 3
    adapter_ffn_dim: 1024
    adapter_dropout: 0.0
    adapter_use_finger_embed: true
    adapter_use_pos_query: true
    adapter_residual: weighted_mean
    gray_to_rgb_init: ones_repeat
    vae_latent_mode: mean
    enable_pre_fuse: true
    lambda_loc: 1.0
    lambda_loc_pre: 0.3
    lambda_pose: 0.1
    lambda_kl: 0.0
    flow_loss:
      enabled: true
      form: sqrt_magnitude_aware
      lambda_w: 2.0
      w_max: 5.0
      eps: 1.0e-06
      contact_threshold: 0.5
      temporal_smooth_window: 1
data:
  T_choices:
  - 1
  - 9
