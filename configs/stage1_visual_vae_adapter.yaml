# =============================================================================
# Stage 1 lite: visual VAE + tactile adapter probe (v0d_full)
# =============================================================================
# v0d: v0c-A's deeper transformer set-encoder PLUS three TouchAnything-aligned
# orthogonal upgrades. All v0d additions are zero-init residual gates so step 0
# is bit-for-bit identical to v0c-A and warm-start from v0c-A `step_30000` is
# clean (see docs and smoke_visual_vae_adapter.py section 6c for proofs).
#
#   1. Pose injection (Option D): q = (hand_query + alpha_pose * PoseEncoder(
#      hand_pose)) + pos_embed[h,w]. Lets the finger self-attention block use
#      a pose-aware query without re-architecting the 6-token attention layout.
#
#   2. TimeSformer post-adapter (Path 2): 2-block divided space-time attention
#      over the (B, T_lat, H*W=48, 128) per-cell hand-out tokens. Refines
#      temporal context for T=9 clips (where T_lat=2). Inserted as an
#      alpha_temp-gated residual so step 0 is still v0c-A.
#
#   3. AuxPoseDecoder dropped (Option A): pose is now an INPUT, not a target.
#      Mirrors TouchAnything's `tactile_prediction` branch which builds a
#      PoseEncoder but no PoseDecoder. lambda_pose is set to 0.0 explicitly
#      for documentation -- the trainer also auto-zeros pose_loss when
#      use_pose_injection=True.
#
# Warm-start: pretrained_ckpt points at v0c-A `step_30000/model.pt`. New keys
# (pose_encoder.*, timesformer_blocks.*, alpha_pose, alpha_temp) are missing
# from that ckpt and loaded fresh (alpha-zero). The dropped aux_pose.* keys
# in the v0c-A ckpt become unexpected_keys and are silently ignored.
#
# Run:
#     bash scripts/train_visual_vae_adapter_v0d_full.sh
# =============================================================================

train_data_class: TactileDataset
train_data_class_path: data/tactile_dataset.py

# ----- Output / logging ----------------------------------------------------
output_dir: outputs/stage1_lite_v0d_full
sub_folder: null
logging_dir: tb

# ----- Frozen visual VAE ---------------------------------------------------
visual_vae_path: pretrained_models/ltx_video
visual_vae_path_kind: subfolder
visual_vae_load_weights: true

# ----- Mixed precision ----------------------------------------------------
mixed_precision: bf16
gradient_accumulation_steps: 1
nccl_timeout: 1800
allow_tf32: true
seed: 42

# ----- Optimizer + LR schedule ---------------------------------------------
# Identical to v0c-A so the v0d-vs-v0c-A delta is strictly the adapter additions.
optimizer: adamw
optimizer_8bit: false
optimizer_torchao: false
lr: 1.0e-4
beta1: 0.9
beta2: 0.95
beta3: 0.98
epsilon: 1.0e-8
weight_decay: 1.0e-4
scale_lr: false

lr_scheduler: constant_with_warmup
lr_warmup_steps: 1000
lr_num_cycles: 1
lr_power: 1.0

# ----- Training schedule ---------------------------------------------------
# 60k steps total (~3.5 epochs at batch_size=16 on the 488-ep corpus, where
# one epoch ~= 17,400 steps). Two reasons for the longer horizon vs v0c-A's
# 30k schedule:
#
#   (a) v0d's pose / temporal heads start at alpha_pose=alpha_temp=0 (zero
#       residual), so step 0 is literally v0c-A. The new capacity only
#       starts taking effect once the alphas move off zero, which empirically
#       takes O(few thousand) steps to ramp up. Giving v0d only 30k means
#       a substantial fraction of training is spent on the alpha ramp rather
#       than on actually exploiting the new pose / temporal context.
#
#   (b) We have a v0c-A_extend60k run available
#       (outputs/stage1_lite_v0c_full_extend60k/
#        2026_05_15_00_27_39/) trained for 60k steps total under the same
#       protocol, so the v0d-vs-v0c-A comparison can now be apples-to-apples
#       at BOTH step 30k (vs canonical v0c-A) AND step 60k (vs the extended
#       v0c-A run). This sharpens the answer to "is v0d's gap-closure
#       advantage real, or does v0c-A close the same gap given more steps?"
#
# Apples-to-apples comparison points (look at these on wandb):
#   step 12k:  v0d vs v0c-A_full  (warm-start advantage)
#   step 30k:  v0d vs v0c-A_full  (canonical comparison)
#   step 60k:  v0d vs v0c-A_full_extend60k (longer-horizon comparison)
batch_size: 16
gradient_checkpointing: false
train_epochs: 7                         # upper bound; train_steps wins first
train_steps: 60000
max_grad_norm: 1.0

steps_to_log: 25
steps_to_val: 1000
# 60000 / 5000 = 12 step-checkpoints @ ~864 MB each ~= 10 GB of disk per run,
# plus the 2 dual-best ckpts (~1.7 GB). Bumping to 10k step interval -> 6
# step-ckpts ~= 5 GB if disk pressure becomes an issue; keep 5k for now to
# preserve the resolution at the 12k / 30k / 60k comparison points.
steps_to_save: 5000

# Frozen VAE -> no KL warmup needed.
lambda_kl_warmup_steps: 0

# ----- Best-checkpoint selectors (DUAL-BEST) -------------------------------
# Same dual-best dispatch as v0c-A: one ckpt per tracked metric.
best_ckpt_metrics:
  - val_flow_mse_active_mean
  - val_recall_post_mean

# ----- DataLoader ----------------------------------------------------------
dataloader_num_workers: 4
persistent_workers: true
pin_memory: true

# ----- wandb (parallel to TensorBoard, optional) ---------------------------
wandb:
  enabled: true
  project: dex_vtam_tactile_vae_stage1
  entity: null
  name: null
  tags: ["stage1_lite_v0d", "full_488", "frozen_visual_vae",
         "finger_set_transformer", "diverse_488_episodes",
         "pose_injection", "timesformer", "warmstart_v0c_a",
         "train_60k"]
  notes: >-
    Stage 1 lite v0d: v0c-A FingerSetTransformerAdapter + pose injection +
    TimeSformer post-adapter + AuxPoseDecoder dropped. Warm-started from
    v0c-A step_30000 with alpha_pose=alpha_temp=0 so step 0 is bit-equal
    v0c-A. Same 488-ep corpus, same val split, same optimizer + LR schedule
    as v0c-A; trained for 60k steps (vs v0c-A's canonical 30k) so the v0d
    pose / temporal heads have time to ramp past the alpha-zero init.
    Apples-to-apples vs v0c-A on val/recall_post and val/flow_mse_active_post:
      * at step 30k vs canonical v0c-A_full step 30k,
      * at step 60k vs v0c-A_full_extend60k step 60k.
    Acceptance gate: >=20% gap closure on val/recall_post (T=1: 0.656->0.71+,
    T=9: 0.575->0.62+) at step 30k or step 60k.
  mode: online

# =============================================================================
# Adapter wrapper config -- v0d: FingerSetTransformerAdapter + pose injection
#                                + TimeSformer post-adapter
# =============================================================================
tactile_vae:
  # Warm-start from v0c-A `step_30000`. Loaded with strict=False so the new
  # v0d keys (pose_encoder.*, timesformer_blocks.*, alpha_pose, alpha_temp)
  # are missing (and re-init from FingerSetTransformerAdapter.__init__) and
  # the dropped aux_pose.* keys are unexpected (silently skipped).
  #
  # Path resolved 2026-05-19 against the canonical v0c-A_FULL run
  # (timestamp 2026_05_14_18_42_51) by listing
  #     outputs/stage1_lite_v0c_full/*/checkpoints/
  # The launcher (scripts/train_visual_vae_adapter_v0d_full.sh) fails
  # loudly if this file doesn't exist, so future v0c-A runs that overwrite
  # the directory layout are caught before a GPU launch.
  model_path: outputs/stage1_lite_v0c_full/2026_05_14_18_42_51/checkpoints/step_00030000/model.pt

  config:
    # ----- Inherited from v0c-A ----------------------------------------
    adapter_kind: finger_set_transformer
    latent_channels: 128
    num_fingers: 5
    spatial_h: 6
    spatial_w: 8
    adapter_n_heads: 8
    adapter_n_layers: 3
    adapter_ffn_dim: 1024
    adapter_dropout: 0.0
    adapter_use_finger_embed: true
    adapter_use_pos_query: true
    adapter_residual: weighted_mean
    gray_to_rgb_init: ones_repeat
    vae_latent_mode: mean
    enable_pre_fuse: true

    # ----- v0d additions -----------------------------------------------
    # Pose injection (Option D, alpha-zero-init):
    #   q = (hand_query + alpha_pose * PoseEncoder(hand_pose)) + pos_embed[h,w]
    adapter_use_pose_injection: true
    adapter_pose_dim: 22

    # TimeSformer post-adapter (Path 2, alpha-zero-init):
    #   hand_grid = hand_grid + alpha_temp * TimeSformer(hand_grid)
    adapter_use_timesformer: true
    adapter_timesformer_num_blocks: 2
    adapter_timesformer_num_heads: 8
    adapter_timesformer_ffn_dim: 512

    # Finger dropout (regularization). Off for the v1 v0d run; flip to e.g.
    # 0.1 in an ablation to test MAE-style mask-token regularization.
    adapter_finger_dropout: 0.0

    # ----- Loss weights ------------------------------------------------
    lambda_loc:     1.0
    lambda_loc_pre: 0.3
    # v0d Option A: AuxPoseDecoder is dropped. The trainer auto-zeros
    # pose_loss when adapter_use_pose_injection=true, but we set
    # lambda_pose=0.0 here explicitly so the total-loss formula reads as
    # 0 even if someone toggles use_pose_injection off.
    lambda_pose:    0.0
    lambda_kl:      0.0

    flow_loss:
      enabled: true
      form: sqrt_magnitude_aware
      lambda_w: 2.0
      w_max: 5.0
      eps: 1.0e-6
      contact_threshold: 0.5
      temporal_smooth_window: 1

# =============================================================================
